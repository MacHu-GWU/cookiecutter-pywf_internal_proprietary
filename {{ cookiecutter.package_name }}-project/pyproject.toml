# [project] table: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[project]
name = "{{ cookiecutter.package_name }}"
# Bump before each release (https://semver.org/), then ``mise run inst`` to update ``uv.lock``.
version = "{{ cookiecutter.version }}"
description = "An example project generated by cookiecutter-pywf_internal_proprietary."
# Closed source: a PEP 639 ``LicenseRef-`` expression; keep ``LICENSE.txt`` in sync.
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#license-and-license-files
license = "{{ cookiecutter.license }}"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.author_email }}" },
]
maintainers = [
    { name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.author_email }}" },
]
keywords = []
readme = "README.rst"
requires-python = ">=3.11,<4.0"
# Read: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# --- Dependencies ---
# Edit these lists, then ``mise run inst`` to update ``uv.lock`` and ``.venv``.
dependencies = [
    # private, from CodeArtifact: each one also has a [tool.uv.sources] line below
    "esc-aws-org-struct>=0.1.3,<1.0.0", # a private package for the demo; replace with your own
]

# --- Optional dependencies (extras) ---
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
# Each one must support every Python version in ``requires-python``.
[project.optional-dependencies]

# local development
dev = [
    "rich>=14.3.4,<15.0.0",
]

# tests and coverage
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

# docs build
doc = [
    "Sphinx>=8.2.3,<9.0.0", # held below 9 until its autodoc rewrite is verified
    "sphinx-copybutton>=0.5.2,<1.0.0", # copy button on code blocks
    "sphinx-design>=0.7.0,<1.0.0", # cards, tabs, grids
    "sphinx-jinja>=2.0.2,<3.0.0", # jinja in reST
    "furo==2025.12.19", # theme
    "pygments>=2.18.0,<3.0.0", # syntax highlighting
    "ipython>=8.18.1,<8.19.0", # notebook execution
    "ipykernel>=7.3.0,<8.0.0", # notebook kernel
    "nbsphinx>=0.9.8,<1.0.0", # notebooks as doc pages
    "rstobj>=2.0.0,<3.0.0", # reST from Python
    "docfly>=3.0.3,<4.0.0", # toctree and API reference
]

# mise tasks
mise = [
    "PyGithub>=2.8.0,<3.0.0", # GitHub API client
]

[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project"
Documentation = "https://{{ cookiecutter.package_name | slugify }}.pages.dev"
Repository = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project"
Issues = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/issues"
Changelog = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/blob/main/release-history.rst"
Download = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.package_name }}-project/releases"

# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts
[project.scripts]

# --- Private index: AWS CodeArtifact ---
# ``explicit = true``: only the packages pinned in [tool.uv.sources] come from this index;
# everything else resolves from PyPI. ``mise run inst`` fetches the token
# (``.mise/tasks/codeartifact-env.sh`` sets UV_INDEX_{{ cookiecutter.aws_codeartifact_domain | upper | replace('-', '_') }}_USERNAME / UV_INDEX_{{ cookiecutter.aws_codeartifact_domain | upper | replace('-', '_') }}_PASSWORD).
# Read: https://docs.astral.sh/uv/concepts/indexes/#explicit-indexes
[[tool.uv.index]]
name = "{{ cookiecutter.aws_codeartifact_domain }}"
url = "https://{{ cookiecutter.aws_codeartifact_domain }}-{{ cookiecutter.aws_account_id }}.d.codeartifact.{{ cookiecutter.aws_region }}.amazonaws.com/pypi/{{ cookiecutter.aws_codeartifact_repository }}/simple/"
authenticate = "always"
explicit = true

# Pin EVERY private package to the index, transitive ones included: uv reads sources only
# from this file, never from a dependency's own pyproject.toml. Each one is also a requirement above.
# Read: https://docs.astral.sh/uv/concepts/indexes/#pinning-a-package-to-an-index
[tool.uv.sources]
esc-aws-org-struct = { index = "{{ cookiecutter.aws_codeartifact_domain }}" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "{{ cookiecutter.package_name }}*",
]
exclude = [
    "{{ cookiecutter.package_name }}.tests",
    "{{ cookiecutter.package_name }}.tests.*",
    "{{ cookiecutter.package_name }}.docs",
    "{{ cookiecutter.package_name }}.docs.*",
]

# --- ruff: ``mise run format`` / ``mise run lint`` ---
[tool.ruff]
extend-exclude = [
    "{{ cookiecutter.package_name }}/vendor",
    ".claude/skills/*/assets", # templates, not valid Python
]

[tool.ruff.lint.per-file-ignores]
# re-export modules
"**/__init__.py" = ["F401"]
"**/api.py" = ["F401"]

# --- pytest 9+ native table ---
# Read: https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
[tool.pytest]
testpaths = ["tests"]
# strict = true # only with a pinned pytest
# filterwarnings = ["error"]
# markers = ["slow: tests that take more than a few seconds"]

# --- Build (``mise run build``); setuptools 77+ for PEP 639 ``license`` ---
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
