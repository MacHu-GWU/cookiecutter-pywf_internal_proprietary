# ==============================================================================
# The tpl repo of a cookiecutter template. It is not a Python package: this
# file only records the template's version and pins the dependencies of the
# maintenance scripts in .mise/tasks/.
#
# Spec: .claude/skills/cctpl-base-cn/references/08-versioning-and-release.md
# ==============================================================================
[project]
name = "cookiecutter_pywf_internal_proprietary"
# A copy of the seed's version: seed and tpl share one version, and the seed's
# pyproject.toml is its only source. Never edit it here: `mise run sync` writes
# it here, into uv.lock, cookiecutter.json (_template_version) and README.rst.
version = "1.0.0"
description = "Cookiecutter template for internal proprietary Python library projects published to AWS CodeArtifact"
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
maintainers = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
readme = "README.rst"
requires-python = ">=3.11,<4.0"

# Direct imports of .mise/tasks/
dependencies = [
    "cookiecutter>=2.6.0,<3.0.0",
    "cookiecutter_maker>=1.1.0,<2.0.0",
    "pygithub_mate>=0.1.1,<1.0.0",
    "jinja2>=3.1.0,<4.0.0", # renders README.rst
    "pathspec>=0.12.0,<2.0.0", # matches EXCLUDE in check-roundtrip
]

[project.urls]
Homepage = "https://github.com/MacHu-GWU/cookiecutter-pywf_internal_proprietary"
Repository = "https://github.com/MacHu-GWU/cookiecutter-pywf_internal_proprietary"
Issues = "https://github.com/MacHu-GWU/cookiecutter-pywf_internal_proprietary/issues"
Changelog = "https://github.com/MacHu-GWU/cookiecutter-pywf_internal_proprietary/blob/main/release-history.rst"

[tool.uv]
# Only a virtual environment for the scripts; never build or install this repo.
package = false
